name: Nightly streak update

# Daily at 11:37 UTC, after the nba-editorial-bots 10:23 UTC build republishes the
# season box-score file this reads (no token), with a 15:37 UTC retry. Each run
# rebuilds the whole section from history/ (committed Kaggle extract through 2025-26)
# plus the season file: active streaks and droughts (including ones that began this
# season), leaderboards, player pages, team pages, Active Streaks and the sitemap.
# Only pages whose content changed get a new sitemap lastmod, and a run with nothing
# new commits nothing. Also by hand from the Actions tab.
on:
  schedule:
    - cron: "37 11 * * *"
    - cron: "37 15 * * *"
  workflow_dispatch:
    inputs:
      skip_ready_check:
        description: "Build even if the season file may not cover last night yet"
        type: boolean
        default: false

# contents: the commit below (restricted to build outputs). pages: request a Pages
# build after the push (pushes made with this token may not start one on their own).
permissions:
  contents: write
  pages: write

concurrency:
  group: nightly-streaks
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install pandas numpy

      - name: Rebuild the section
        id: build
        run: |
          # exit 4 = the season file has not been republished for last night yet:
          # nothing is built and the next run retries, so the run stays green.
          set +e
          python nightly_build.py ${{ inputs.skip_ready_check && '--no-ready-check' || '' }} 2>&1 | tee /tmp/build.log
          rc=${PIPESTATUS[0]}
          set -e
          if [ "$rc" = "4" ]; then
            echo "::warning title=Season file not ready::Nothing built; the next run retries."
            echo "skip=1" >> "$GITHUB_OUTPUT"; exit 0
          fi
          exit $rc

      - name: Commit ONLY build outputs
        if: steps.build.outputs.skip != '1'
        id: commit
        run: |
          git config user.name  "nba-streaks-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Stage ONLY the build outputs — never scripts, history/ or data/.
          git add -A -- active-state.json active-streaks.html lastgame.html index.html feats.html \
            droughts.html teams.html players teams streaks-data.js feats-data.js search-index.js \
            droughts-data.js droughts-leaderboard-data.js sitemap.xml sitemap-lastmod.json

          staged="$(git diff --cached --name-only)"
          echo "Staged $(echo "$staged" | grep -c . || true) file(s)"

          # Hard guard: abort if anything outside the allowed set got staged.
          if echo "$staged" | grep -v '^$' | grep -qvE '^(active-state\.json|active-streaks\.html|lastgame\.html|index\.html|feats\.html|droughts\.html|teams\.html|players/[^/]+\.html|teams/[^/]+\.html|streaks-data\.js|feats-data\.js|search-index\.js|droughts-data\.js|droughts-leaderboard-data\.js|sitemap\.xml|sitemap-lastmod\.json)$'; then
            echo "::error::Out-of-scope file staged — refusing to commit."
            exit 1
          fi

          if [ -z "$staged" ]; then
            echo "No changes to commit."
            exit 0
          fi

          through=$(python -c "import json;print(json.load(open('active-state.json'))['data_through'])")
          git commit -q -m "Nightly streak update (games through $through)"
          git push
          echo "pushed=1" >> "$GITHUB_OUTPUT"

      - name: Request a GitHub Pages build
        if: steps.commit.outputs.pushed == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "::warning::Pages build request failed; the push may still trigger one."
