name: Nightly streak update

# Daily at 11:37 UTC, after the nba-editorial-bots 10:23 UTC build republishes the
# season box-score file this reads (no token), with a 15:37 UTC retry. Both run
# nightly_catchup.py, which applies only the nights active-state.json is missing, so
# a run with nothing new changes nothing. Also by hand from the Actions tab: a blank
# date catches up to last night, a date applies that one night only.
on:
  schedule:
    - cron: "37 11 * * *"
    - cron: "37 15 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "One night to apply (YYYY-MM-DD). Blank = every missing night through last night, US Eastern."
        required: false
        default: ""

# Only the contents scope; the commit step below is further restricted to 3 paths.
permissions:
  contents: write

concurrency:
  group: nightly-streaks
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install pandas numpy

      - name: Run nightly fetcher
        run: |
          if [ -n "${{ inputs.date }}" ]; then
            python fetch_nightly.py --date "${{ inputs.date }}"
          else
            # exit 4 = the season file has not been republished for the next night yet:
            # nothing is applied and the next run retries, so the run stays green.
            rc=0; python nightly_catchup.py || rc=$?
            if [ "$rc" = "4" ]; then echo "::warning title=Season file not ready::Nothing applied; the next run retries."; rc=0; fi
            exit $rc
          fi

      # Hash-compares every public page against sitemap-lastmod.json; only new or
      # changed pages get today's (UTC) lastmod, unchanged pages keep theirs.
      - name: Update sitemap
        run: python build_sitemap.py

      - name: Commit ONLY pipeline outputs (active-state.json, data/daily/, active-streaks.html, lastgame.html, sitemap)
        run: |
          git config user.name  "nba-streaks-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Stage ONLY the allowed outputs — never engine/build files or player pages.
          # (lastgame.html is the static redirect stub kept for old links.)
          git add active-state.json active-streaks.html lastgame.html sitemap.xml sitemap-lastmod.json
          if [ -d data/daily ]; then git add data/daily; fi

          staged="$(git diff --cached --name-only)"
          echo "Staged files:"; echo "$staged"

          # Hard guard: abort if anything outside the allowed set got staged.
          if echo "$staged" | grep -qvE '^(active-state\.json|active-streaks\.html|lastgame\.html|sitemap\.xml|sitemap-lastmod\.json|data/daily/)'; then
            echo "::error::Out-of-scope file staged — refusing to commit."
            exit 1
          fi

          if [ -z "$staged" ]; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Nightly streak update ($(date -u +%F))"
          git push
